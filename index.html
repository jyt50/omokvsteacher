  if (location.hash.startsWith('#host') || location.hash.startsWith('#play')) go(join ? `#join=${join}` : '', { replace: true });
  const snap = store.get(STORE_HOST);
  const fresh = snap && Date.now() - (snap.savedAt || 0) < 12 * 3600 * 1000;
  const lastNick = (join && store.get(storeStudentKey(join))?.nickname) || store.get('omok1.lastNickname') || '';
  const fileWarn =
    location.protocol === 'file:'
      ? `<p class="notice warn small">지금은 이 컴퓨터의 파일로 열려 있습니다. 선생님은 이대로 방을 만들 수 있지만, 학생들은 <b>웹에 올린 같은 HTML 주소</b>로 접속해 방 코드를 입력해야 합니다.</p>`
      : '';
  $('#app').innerHTML = `
  <div class="home">
    <header class="home-hero">
      <div class="logo" aria-hidden="true">${stoneIcon('B', 34)}${stoneIcon('W', 34)}</div>
      <h1>교실 집단지성 오목</h1>
      <p>선생님 한 명 vs 우리 반 전체! 모두의 투표로 한 수를 결정해요.</p>
    </header>
    ${message ? `<p class="notice ${/삭제했습니다/.test(message) ? 'ok' : 'error'}">${esc(message)}</p>` : ''}
    <div class="tabs" role="tablist">
      <button role="tab" data-act="homeTab" data-tab="student" class="active">학생 입장</button>
      <button role="tab" data-act="homeTab" data-tab="teacher">선생님(방장)</button>
    </div>
    <form class="card form" id="joinForm" data-tab-panel="student">
      <label>방 코드<input name="code" class="code-input" value="${esc(join)}" placeholder="예: K7P2Q" autocomplete="off" autocapitalize="characters" maxlength="6"></label>
      <label>닉네임 (1~12자)<input name="nickname" value="${esc(lastNick)}" placeholder="예: 오목왕" autocomplete="off" maxlength="12"></label>
      <p class="notice error" id="joinError" hidden></p>
      <button class="btn primary big" id="joinBtn">게임 입장</button>
    </form>
    <div class="card form" data-tab-panel="teacher" hidden>
      <p class="muted small">이 기기(교사 PC)가 게임 서버 역할을 합니다. <b>수업 중에는 이 창을 닫지 말고 화면에 띄워 두세요.</b> 학생 기기와는 인터넷을 통해 직접 연결됩니다.</p>
      ${fileWarn}
      ${fresh ? `<div class="resume"><div><b>진행 중이던 방 ${esc(snap.code)}</b><div class="muted small">학생 ${snap.participants.length}명 · ${snap.moves.length}수 진행</div></div><button class="btn primary" data-act="resumeRoom">이어하기</button><button class="btn danger small" data-act="discardRoom">삭제</button></div>` : ''}
      <button class="btn ${fresh ? '' : 'primary'} big" data-act="createRoom">새 게임방 만들기</button>
    </div>
    <p class="home-foot muted small">회원가입·설치 없이 사용합니다. 닉네임은 해당 방 안에서만 쓰이며 다른 개인정보는 저장하지 않습니다.</p>
  </div>`;
  if (join) $('#joinForm [name=nickname]').focus();
}

async function submitJoin(form) {
  const code = cleanCode(form.code.value);
  const nickname = form.nickname.value.trim();
  const errEl = $('#joinError');
  const btn = $('#joinBtn');
  const showErr = (msg) => {
    errEl.textContent = msg;
    errEl.hidden = !msg;
  };
  showErr('');
  if (code.length < 4) return showErr('방 코드를 4~6자리로 입력해 주세요.');
  if (!normalizeNickname(nickname)) return showErr('닉네임을 1~12자로 입력해 주세요.');
  const saved = store.get(storeStudentKey(code)) || {};
  store.set(storeStudentKey(code), { token: saved.token, nickname });
  btn.disabled = true;
  btn.textContent = '선생님 기기와 연결하는 중…';
  const res = await Student.start(code, { initial: true });
  if (currentView !== 'home') return;
  btn.disabled = false;
  btn.textContent = '게임 입장';
  if (!res.ok) {
    if (!saved.token) store.set(storeStudentKey(code), null);
    return showErr(res.error);
  }
  Student.initial = false;
  go(`#play=${code}`);
  renderStudent(true);
}

// ---------- 교사 화면
function renderTeacher(force = false) {
  if (!Host.room) return;
  if (currentView !== 'teacher' || force) {
    currentView = 'teacher';
    $('#app').innerHTML = `<div id="t-net"></div><div class="page teacher"><header class="topbar" id="t-top"></header><section class="share card" id="t-share"></section><div id="t-toast"></div>
      <main class="layout"><section class="board-col"><div id="t-banner"></div><div class="board-wrap" id="t-board"></div><div id="t-confirm"></div><div class="controls" id="t-controls"></div></section>
      <aside class="side-col"><div id="t-vote"></div><div id="t-result"></div><section class="card" id="t-teams"></section><section class="card" id="t-panel"></section></aside></main><div id="t-overlay"></div></div>`;
  }
  const room = Host.room;
  const ui = Host.ui;
  const st = { ...room.hostState(), receivedAt: performance.now() };
  Host.view = st;
  const { phase, turn, vote, board, teamColor } = st;
  const playing = phase === 'playing';

  const turnKey = `${st.gameNo}-${st.moves.length}-${turn}-${vote?.status}`;
  if (turnKey !== ui.turnKey) {
    ui.turnKey = turnKey;
    ui.selected = null;
    ui.directMode = false;
  }

  // 연결 상태 띠
  let net = '';
  if (Host.status === 'starting') net = '<div class="conn-banner info">방을 준비하는 중입니다… (중계 서버에 연결 중)</div>';
  else if (Host.status === 'reconnecting') net = `<div class="conn-banner">${esc(Host.statusMsg || '연결이 끊어졌습니다. 다시 연결하는 중…')} 학생들은 자동으로 다시 연결됩니다.</div>`;
  else if (Host.status === 'failed') net = `<div class="conn-banner">${esc(Host.statusMsg)}</div>`;
  patch('t-net', net);

  patch(
    't-top',
    `<div class="brand">교실 집단지성 오목 <span class="badge">교사</span></div><div class="topbar-info"><span class="chip code-chip">방 코드 <b>${room.code}</b></span><span class="chip">접속 학생 <b>${st.students.online}</b>명${st.students.total > st.students.online ? `<small> / 전체 ${st.students.total}</small>` : ''}</span><span class="chip phase-${phase}">${{ lobby: '대기 중', playing: '진행 중', paused: '일시정지', ended: '게임 종료' }[phase]}</span></div>`,
  );

  const base = location.href.split('#')[0];
  const joinUrl = `${base}#join=${room.code}`;
  patch(
    't-share',
    `<div class="share-main"><div class="muted small">학생 접속 주소</div><div class="share-url">${esc(location.protocol === 'file:' ? '(웹에 올린 이 HTML의 주소)' : joinUrl)}</div>${location.protocol === 'file:' ? '<div class="muted small">파일로 열려 있어 주소를 표시할 수 없습니다. 학생은 웹 주소로 접속해 방 코드를 입력하세요.</div>' : ''}</div><div class="share-code"><div class="muted small">방 코드</div><div class="big-code">${room.code}</div></div>${location.protocol === 'file:' ? '' : `<button class="btn small" data-act="copyUrl" data-url="${esc(joinUrl)}">주소 복사</button>`}`,
  );

  patch('t-toast', ui.error ? `<div class="toast error" role="alert">${esc(ui.error)}</div>` : '');

  // 상태 띠
  let title;
  let tone = 'idle';
  if (phase === 'lobby') title = '대기 중 — 학생들이 입장하면 [게임 시작]을 누르세요';
  else if (phase === 'ended') [title, tone] = [`게임 종료 — ${resultText(st.result)}`, 'end'];
  else if (phase === 'paused') [title, tone] = ['⏸ 일시정지 중', 'paused'];
  else if (turn === 'teacher') [title, tone] = [`선생님 차례 (${teamColor.teacher === 'B' ? '흑돌' : '백돌'})`, 'teacher'];
  else if (vote?.status === 'open') [title, tone] = ['학생 팀 투표 진행 중', 'vote'];
  else if (vote?.status === 'tie') [title, tone] = ['동점 — 결정이 필요합니다', 'paused'];
  else [title, tone] = ['학생 팀 차례', 'vote'];
  patch('t-banner', `<div class="status-banner tone-${tone}"><strong>${title}</strong>${vote?.status === 'open' ? countdownHTML() : ''}</div>`);

  // 오목판
  let mode = null;
  if (playing && turn === 'teacher') mode = 'place';
  else if (playing && turn === 'students' && vote?.status === 'tie') mode = 'tie';
  else if (playing && turn === 'students' && ui.directMode) mode = 'direct';
  Host.mode = mode;
  const marks = {};
  if (vote?.status === 'open' && vote.liveTally && !ui.hideTally) for (const t of vote.liveTally) marks[t.cell] = { text: t.count };
  if (vote?.status === 'tie' && st.lastVoteResult) for (const t of st.lastVoteResult.tally) if (vote.tieCells.includes(t.cell)) marks[t.cell] = { text: t.count, tone: 'tie' };
  patch(
    't-board',
    boardSVG({
      role: 'teacher',
      board,
      lastMove: st.lastMove,
      winLine: st.result?.line,
      marks,
      highlight: vote?.status === 'tie' ? vote.tieCells : vote?.status === 'open' ? vote.candidates : null,
      selectedCell: ui.selected,
      ghostColor: mode === 'place' ? teamColor.teacher : mode ? teamColor.students : null,
      clickable: !!mode,
    }),
  );

  let confirm = '';
  if (mode) {
    if (ui.selected === null) {
      const hint = {
        place: `선생님 차례: 둘 자리를 누른 뒤 확정하세요 (${teamColor.teacher === 'B' ? '흑돌' : '백돌'})`,
        tie: '동점 후보(점선) 중 하나를 눌러 학생 팀의 수를 결정하세요.',
        direct: '학생 팀 돌을 직접 둘 자리를 누르세요. (진행 중인 투표는 취소됩니다)',
      }[mode];
      confirm = `<div class="confirm-bar"><span>${hint}</span></div>`;
    } else {
      confirm = `<div class="confirm-bar"><span><b class="big-label">${cellLabel(ui.selected)}</b>에 ${mode === 'place' ? '선생님 팀' : '학생 팀'} 돌을 둘까요?</span><button class="btn primary" data-act="confirmMove">착수 확정</button><button class="btn" data-act="cancelSelect">취소</button></div>`;
    }
  }
  patch('t-confirm', confirm);

  let controls = '';
  if (phase === 'lobby') controls += '<button class="btn primary big" data-act="h" data-type="start">▶ 게임 시작</button>';
  if (phase === 'playing') controls += '<button class="btn" data-act="h" data-type="pause">⏸ 일시정지</button>';
  if (phase === 'paused') controls += '<button class="btn primary" data-act="h" data-type="resume">▶ 재개</button>';
  if (playing || phase === 'paused') controls += '<button class="btn warn" data-act="h" data-type="end" data-confirm="게임을 종료할까요?">■ 게임 종료</button>';
  controls += `<button class="btn" data-act="h" data-type="reset" ${playing || phase === 'paused' ? 'data-confirm="진행 중인 게임을 초기화할까요?"' : ''}>↺ 초기화</button>`;
  if (phase === 'ended') controls += '<button class="btn primary" data-act="h" data-type="rematch">재경기 시작</button>';
  controls += '<button class="btn danger" data-act="deleteRoom">방 삭제</button>';
  patch('t-controls', controls);

  // 투표 카드
  const studentTurn = turn === 'students' && (playing || phase === 'paused');
  let vc = '';
  if (studentTurn) {
    vc = `<section class="card vote-card"><h3>학생 투표 ${vote?.round > 1 ? '<span class="badge">재투표</span>' : ''}</h3>`;
    if (!vote) vc += `<p class="muted">학생 팀 차례입니다.</p><button class="btn primary" data-act="h" data-type="startVote" ${playing ? '' : 'disabled'}>학생 투표 시작 (${st.settings.voteSeconds}초)</button>`;
    if (vote?.status === 'open') {
      vc += `${countdownHTML()}<p class="vote-count">투표 <b>${vote.votedCount}</b> / 접속 ${st.students.online}명</p>
        <div class="row-btns"><button class="btn primary" data-act="h" data-type="closeVote" ${playing ? '' : 'disabled'}>즉시 마감</button><button class="btn" data-act="h" data-type="extendVote">+10초</button></div>
        <label class="check small"><input type="checkbox" data-change="hideTally" ${ui.hideTally ? 'checked' : ''}> 득표수 숨기기 (교사 화면을 TV로 보여줄 때)</label>
        ${ui.hideTally ? '' : tallyHTML(vote.liveTally, vote.votedCount)}`;
    }
    if (vote?.status === 'tie') {
      vc += `<p><b>동점입니다.</b> 후보: ${vote.tieCells.map(cellLabel).join(', ')}</p><div class="row-btns wrap">${vote.tieCells
        .map((c) => `<button class="btn" data-act="h" data-type="resolveTie" data-cell="${c}" ${playing ? '' : 'disabled'}>${cellLabel(c)}로 결정</button>`)
        .join('')}</div><div class="row-btns"><button class="btn primary" data-act="h" data-type="runoff" ${playing ? '' : 'disabled'}>동점 후보로 재투표</button><button class="btn" data-act="h" data-type="startVote" ${playing ? '' : 'disabled'}>전체 다시 투표</button></div>`;
    }
    if (vote?.status === 'noVotes') vc += `<p>아무도 투표하지 않았습니다.</p><button class="btn primary" data-act="h" data-type="startVote" ${playing ? '' : 'disabled'}>다시 투표하기</button>`;
    if (playing && vote?.status !== 'tie') vc += `<button class="btn small ${ui.directMode ? 'active-toggle' : 'ghost-btn'}" data-act="toggleDirect">${ui.directMode ? '직접 두기 취소' : '투표 없이 학생 돌 직접 두기'}</button>`;
    vc += '</section>';
  }
  patch('t-vote', vc);
  patch('t-result', vote?.status === 'open' ? '' : voteResultHTML(st.lastVoteResult));
  patch('t-teams', `<h3>팀</h3><div class="teams">${teamTag('teacher', teamColor)}<span class="vs">VS</span>${teamTag('students', teamColor)}</div>`);

  // 학생·기록·설정 탭
  const tabBtn = (id, label) => `<button class="${ui.tab === id ? 'active' : ''}" data-act="tab" data-tab="${id}">${label}</button>`;
  let panel = `<div class="seg">${tabBtn('students', `학생 (${st.students.online}/${st.students.total})`)}${tabBtn('history', `기록 (${st.moves.length})`)}${tabBtn('settings', '설정')}</div>`;
  if (ui.tab === 'students') {
    const list = [...st.participants].sort((a, b) => Number(b.online) - Number(a.online) || a.nickname.localeCompare(b.nickname, 'ko'));
    panel += `<ul class="students">${list.length ? '' : '<li class="muted">아직 입장한 학생이 없습니다.</li>'}${list
      .map(
        (p) =>
          `<li class="${p.online ? '' : 'offline'}"><span class="dot ${p.online ? 'on' : 'off'}" title="${p.online ? '접속 중' : '연결 끊김'}"></span><span class="nick">${esc(p.nickname)}</span>${p.online ? '' : '<span class="muted small">연결 끊김</span>'}${p.connections > 1 ? `<span class="muted small">창 ${p.connections}개</span>` : ''}${vote?.status === 'open' ? `<span class="vote-mark ${p.voted ? 'yes' : ''}">${p.voted ? '투표함' : '미투표'}</span>` : ''}<button class="btn tiny ghost-btn" data-act="kick" data-id="${p.id}" data-name="${esc(p.nickname)}">내보내기</button></li>`,
      )
      .join('')}</ul>`;
  } else if (ui.tab === 'history') {
    panel += movesHTML(st.moves);
  } else {
    panel += `<div class="form">
      <label>학생 투표 시간<select data-change="voteSeconds">${CONFIG.voteSecondsOptions.map((s) => `<option value="${s}" ${s === st.settings.voteSeconds ? 'selected' : ''}>${s}초</option>`).join('')}</select></label>
      <label>먼저 두는 팀 (흑돌)<select data-change="firstTeam" ${phase === 'lobby' ? '' : 'disabled'}><option value="teacher" ${st.settings.firstTeam === 'teacher' ? 'selected' : ''}>선생님 팀</option><option value="students" ${st.settings.firstTeam === 'students' ? 'selected' : ''}>학생 팀</option></select></label>
      ${phase === 'lobby' ? '' : '<p class="muted small">선공 팀은 게임 시작 전에만 바꿀 수 있습니다.</p>'}
      <label class="check"><input type="checkbox" data-change="autoStartVote" ${st.settings.autoStartVote ? 'checked' : ''}> 선생님이 두고 나면 학생 투표 자동 시작</label>
      <p class="muted small">투표 시간 변경은 다음 투표부터 적용됩니다.</p></div>`;
  }
  patch('t-panel', panel);
  patch('t-overlay', ui.overlayHiddenFor === st.gameNo ? '' : overlayHTML(st, '<button class="btn primary" data-act="h" data-type="rematch">재경기 시작</button>'));
  tickCountdowns();
}

// ---------- 학생 화면
const CLOSED_TEXT = {
  deleted: '선생님이 게임방을 닫았습니다.',
  kicked: '선생님이 이 방에서 내보냈습니다.',
  left: '방에서 나왔습니다.',
};

function renderStudent(force = false) {
  const S = Student;
  if (!force && (currentView === 'home' || currentView === 'teacher')) return; // 입장 대기 중에는 첫 화면 유지
  if (S.closed || S.fatal) {
    currentView = 'student-end';
    const title = S.closed ? CLOSED_TEXT[S.closed] || '게임이 종료되었습니다.' : '입장할 수 없습니다';
    const html = `<div class="center-screen"><div class="card"><h2>${esc(title)}</h2>${S.fatal ? `<p>${esc(S.fatal)}</p>` : ''}<button class="btn primary" data-act="goHome">처음 화면으로</button></div></div>`;
    if ($('#app').__end !== html) {
      $('#app').innerHTML = html;
      $('#app').__end = html;
    }
    return;
  }
  if (currentView !== 'student' || force) {
    currentView = 'student';
    $('#app').__end = null;
    $('#app').innerHTML = `<div id="s-net"></div><div class="page student"><header class="topbar" id="s-top"></header><div id="s-banner"></div>
      <main class="layout"><section class="board-col"><div class="board-wrap" id="s-board"></div><div id="s-myvote"></div></section>
      <aside class="side-col"><section class="card" id="s-teams"></section><div id="s-result"></div><details class="card"><summary><h3>게임 기록</h3></summary><div id="s-moves"></div></details><button class="btn ghost-btn small" data-act="leave">방 나가기</button></aside></main>
      <div id="s-toast"></div><div id="s-overlay"></div></div>`;
  }
  patch('s-net', S.connected ? '' : `<div class="conn-banner">${S.everJoined ? '선생님 기기와 연결이 끊어졌습니다. 자동으로 다시 연결하는 중…' : '선생님 기기와 연결하는 중…'}</div>`);
  const saved = store.get(storeStudentKey(S.code)) || {};
  const st = S.state;
  patch(
    's-top',
    `<div class="brand">교실 집단지성 오목</div><div class="topbar-info"><span class="chip">방 <b>${esc(S.code)}</b></span><span class="chip">👤 <b>${esc(S.me?.nickname || saved.nickname || '')}</b></span>${st ? `<span class="chip">접속 ${st.students.online}명</span>` : ''}</div>`,
  );
  patch('s-toast', S.ui.toast ? `<div class="toast">${esc(S.ui.toast)}</div>` : '');
  if (!st) {
    patch('s-banner', '<div class="status-banner"><strong>게임 정보를 불러오는 중…</strong></div>');
    return;
  }
  const vote = st.vote;
  const voteOpen = st.phase === 'playing' && vote?.status === 'open';
  const myCell = S.me && vote && S.me.voteId === vote.id ? S.me.cell : null;
  const shownCell = S.ui.pendingCell ?? myCell;
  S.view = st;

  let status;
  if (st.phase === 'lobby') status = ['idle', '곧 게임이 시작됩니다', '선생님이 게임을 시작할 때까지 기다려 주세요.'];
  else if (st.phase === 'ended') status = ['end', resultText(st.result), '선생님이 새 게임을 시작하면 자동으로 이어집니다.'];
  else if (st.phase === 'paused') status = ['paused', '⏸ 일시정지', '선생님이 게임을 잠시 멈췄습니다.'];
  else if (st.turn === 'teacher') status = ['teacher', '선생님 차례입니다', '선생님이 돌을 놓을 때까지 기다려 주세요.'];
  else if (voteOpen) status = ['vote', vote.round > 1 ? '재투표 중! 후보 중 하나를 고르세요' : '투표 중! 원하는 자리를 누르세요', '시간 안에는 몇 번이든 바꿀 수 있어요.'];
  else if (vote?.status === 'tie') status = ['paused', '동점입니다!', '선생님이 결정하거나 재투표를 진행합니다.'];
  else if (vote?.status === 'noVotes') status = ['paused', '투표한 사람이 없습니다', '선생님이 다음 진행을 결정합니다.'];
  else status = ['idle', '학생 팀 차례입니다', '곧 투표가 시작됩니다.'];
  patch('s-banner', `<div class="status-banner tone-${status[0]}"><div><strong>${esc(status[1])}</strong><span>${status[2]}</span></div>${vote?.status === 'open' ? countdownHTML() : ''}</div>`);

  const marks = {};
  if (vote?.status === 'tie' && st.lastVoteResult) for (const t of st.lastVoteResult.tally) if (vote.tieCells.includes(t.cell)) marks[t.cell] = { text: t.count, tone: 'tie' };
  patch(
    's-board',
    boardSVG({
      role: 'student',
      board: st.board,
      lastMove: st.lastMove,
      winLine: st.result?.line,
      marks,
      highlight: vote?.status === 'open' ? vote.candidates : vote?.status === 'tie' ? vote.tieCells : null,
      myCell: voteOpen ? shownCell : null,
      ghostColor: voteOpen ? st.teamColor.students : null,
      clickable: voteOpen,
    }),
  );
  let mv = '';
  if (voteOpen) {
    mv =
      shownCell !== null
        ? `<div class="my-vote"><span>내 선택: <b class="big-label">${cellLabel(shownCell)}</b></span><span class="muted small">다른 교차점을 누르면 투표가 변경됩니다.</span><button class="btn small ghost-btn" data-act="unvote">투표 취소</button></div>`
        : `<div class="my-vote"><b>돌을 놓고 싶은 교차점을 누르세요.</b>${vote.candidates ? ' (점선 표시된 후보 중에서 선택)' : ''}</div>`;
    mv += `<p class="muted small center">다른 친구들의 투표 내용은 투표가 끝난 뒤에 공개됩니다. 투표 ${vote.votedCount}명 참여</p>`;
  }
  patch('s-myvote', mv);
  patch('s-teams', `<h3>팀 정보</h3><div class="teams">${teamTag('teacher', st.teamColor)}<span class="vs">VS</span>${teamTag('students', st.teamColor)}</div><p class="muted small">나는 학생 팀입니다. 총 ${st.moves.length}수 진행</p>`);
  patch('s-result', voteOpen ? '' : voteResultHTML(st.lastVoteResult));
  patch('s-moves', movesHTML(st.moves));
  patch('s-overlay', S.ui.overlayHiddenFor === st.gameNo ? '' : overlayHTML(st));
  tickCountdowns();
}

function studentToast(msg) {
  Student.ui.toast = msg;
  renderStudent();
  clearTimeout(Student.toastTimer);
  Student.toastTimer = setTimeout(() => {
    Student.ui.toast = '';
    renderStudent();
  }, 2500);
}

// ---------- 카운트다운 (서버=교사 기기가 보낸 '남은 시간'만 사용해 기기 시계 차이 영향 없음)
function tickCountdowns() {
  const st = currentView === 'teacher' ? Host.view : currentView === 'student' ? Student.view : null;
  const cd = countdownOf(st);
  document.querySelectorAll('[data-cd]').forEach((el) => {
    if (!cd) return;
    el.classList.toggle('urgent', cd.seconds <= 5);
    el.querySelector('.cd-num').textContent = cd.seconds;
    el.querySelector('.cd-paused').textContent = cd.paused ? ' (일시정지)' : '';
    el.querySelector('.progress-bar').style.width = `${Math.round(cd.ratio * 100)}%`;
  });
}
setInterval(tickCountdowns, 200);

// ===================================================================
// 7. 이벤트 처리
// ===================================================================
document.addEventListener('click', async (e) => {
  const svg = e.target.closest('svg.board');
  if (svg) return onBoardClick(svg, e);
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case 'homeTab':
      document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('active', b === el));
      document.querySelectorAll('[data-tab-panel]').forEach((p) => (p.hidden = p.dataset.tabPanel !== el.dataset.tab));
      break;
    case 'createRoom': {
      const snap = store.get(STORE_HOST);
      if (snap && !confirm(`진행 중이던 방 ${snap.code}의 데이터가 삭제됩니다. 새 방을 만들까요?`)) return;
      store.set(STORE_HOST, null);
      el.disabled = true;
      el.textContent = '방을 만드는 중…';
      Host.start(null);
      break;
    }
    case 'resumeRoom':
      Host.start(store.get(STORE_HOST));
      break;
    case 'discardRoom':
      if (confirm('저장된 방 데이터를 삭제할까요?')) {
        store.set(STORE_HOST, null);
        showHome();
      }
      break;
    case 'h': {
      if (el.dataset.confirm && !confirm(el.dataset.confirm)) return;
      const extra = el.dataset.cell !== undefined ? { cell: Number(el.dataset.cell) } : {};
      Host.act(el.dataset.type, extra);
      break;
    }
    case 'confirmMove': {
      const type = Host.mode === 'place' ? 'place' : Host.mode === 'tie' ? 'resolveTie' : 'placeForStudents';
      if (Host.act(type, { cell: Host.ui.selected })) Host.ui.selected = null;
      renderTeacher();
      break;
    }
    case 'cancelSelect':
      Host.ui.selected = null;
      renderTeacher();
      break;
    case 'toggleDirect':
      Host.ui.directMode = !Host.ui.directMode;
      Host.ui.selected = null;
      renderTeacher();
      break;
    case 'tab':
      Host.ui.tab = el.dataset.tab;
      renderTeacher();
      break;
    case 'kick':
      if (confirm(`${el.dataset.name} 학생을 내보낼까요? 같은 브라우저로는 다시 입장할 수 없습니다.`)) Host.act('kick', { id: el.dataset.id });
      break;
    case 'deleteRoom':
      if (confirm('게임방을 삭제할까요? 학생 닉네임, 투표, 기록이 모두 삭제되고 학생 화면도 종료됩니다.')) Host.destroyRoom();
      break;
    case 'copyUrl': {
      const url = el.dataset.url;
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(url).then(() => Host.showError('주소를 복사했습니다.'), () => prompt('주소를 복사하세요', url));
      else prompt('주소를 복사하세요', url);
      break;
    }
    case 'closeOverlay':
      if (currentView === 'teacher') {
        Host.ui.overlayHiddenFor = Host.room.gameNo;
        renderTeacher();
      } else {
        Student.ui.overlayHiddenFor = Student.state?.gameNo;
        renderStudent();
      }
      break;
    case 'unvote': {
      const res = await Student.request('unvote');
      if (!res.ok) studentToast(res.error);
      break;
    }
    case 'leave':
      if (!confirm('방에서 나갈까요? 닉네임이 반납됩니다.')) return;
      await Student.request('leave');
      store.set(storeStudentKey(Student.code), null);
      Student.closed = 'left';
      Student.teardown();
      renderStudent();
      break;
    case 'goHome':
      Student.teardown();
      Object.assign(Student, { code: null, closed: null, fatal: '' });
      showHome();
      break;
    default:
  }
});

document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  const key = el.dataset.change;
  if (key === 'hideTally') {
    Host.ui.hideTally = el.checked;
    return renderTeacher();
  }
  if (key === 'voteSeconds') Host.act('settings', { voteSeconds: Number(el.value) });
  if (key === 'firstTeam') Host.act('settings', { firstTeam: el.value });
  if (key === 'autoStartVote') Host.act('settings', { autoStartVote: el.checked });
});

document.addEventListener('submit', (e) => {
  if (e.target.id === 'joinForm') {
    e.preventDefault();
    submitJoin(e.target);
  }
});
document.addEventListener('input', (e) => {
  if (e.target.name === 'code' && e.target.classList.contains('code-input')) e.target.value = cleanCode(e.target.value);
});

async function onBoardClick(svg, e) {
  const cell = cellFromClick(svg, e);
  if (cell === null) return;
  if (svg.dataset.role === 'teacher') {
    const st = Host.view;
    if (!Host.mode || st.board[cell] !== null) return;
    if (Host.mode === 'tie' && !st.vote.tieCells.includes(cell)) return;
    Host.ui.selected = cell;
    return renderTeacher();
  }
  const st = Student.state;
  const vote = st?.vote;
  if (!st || st.phase !== 'playing' || vote?.status !== 'open' || st.board[cell] !== null) return;
  if (vote.candidates && !vote.candidates.includes(cell)) return;
  const current = Student.me?.voteId === vote.id ? Student.me.cell : null;
  if (cell === current) return;
  Student.ui.pendingCell = cell;
  renderStudent();
  const res = await Student.request('vote', { cell });
  Student.ui.pendingCell = null;
  renderStudent();
  if (!res.ok) studentToast(res.error);
}

// 교사 화면을 닫으려 할 때 경고 (게임 서버 역할이므로)
window.addEventListener('beforeunload', (e) => {
  if (currentView === 'teacher' && Host.room && Host.room.participants.size > 0) {
    e.preventDefault();
    e.returnValue = '';
  }
});
// 새로고침·창 닫기 직전 최신 상태 저장
window.addEventListener('pagehide', () => Host.save());
window.addEventListener('popstate', route);
route();

</script>
