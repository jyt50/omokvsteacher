<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<title>교실 집단지성 오목</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e3b76a'/%3E%3Ccircle cx='12' cy='14' r='7' fill='%23222'/%3E%3Ccircle cx='21' cy='19' r='7' fill='%23fff' stroke='%23999'/%3E%3C/svg%3E">
<!--
  교실 집단지성 오목 (단일 HTML 버전)
  - 설치·서버 없이 이 파일 하나로 작동합니다.
  - 교사 브라우저가 게임 서버 역할을 하고, 학생 기기는 WebRTC(PeerJS)로 교사 기기에 직접 연결됩니다.
  - 연결 중계를 위해 PeerJS 공용 서버(0.peerjs.com)와 CDN을 사용하므로 인터넷 연결이 필요합니다.
-->
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js';document.head.appendChild(s)"></script>
<style>
/* 교실 집단지성 오목 - 가벼운 단일 CSS */
:root {
  --bg: #f6f3ec;
  --panel: #ffffff;
  --ink: #1f2a2e;
  --muted: #6b7478;
  --line: #e4ddd0;
  --brand: #2f5d50;
  --brand-ink: #ffffff;
  --accent: #e07a2f;
  --blue: #2563eb;
  --danger: #c0392b;
  --warn: #b7791f;
  --wood: #e6bf78;
  --wood-line: #5b4320;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 4px 14px rgba(0, 0, 0, 0.05);
  font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif;
  color: var(--ink);
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; }
h1, h2, h3 { margin: 0 0 0.5em; line-height: 1.25; }
h3 { font-size: 1rem; }
p { margin: 0.4em 0; }
button, input, select { font: inherit; }

.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.center { text-align: center; }

/* ---------- 버튼 ---------- */
.btn {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 10px;
  padding: 0.55em 1em;
  cursor: pointer;
  font-weight: 600;
  min-height: 40px;
  touch-action: manipulation;
}
.btn:hover:not(:disabled) { border-color: #c9bfae; background: #fbfaf7; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover:not(:disabled) { background: #264d42; }
.btn.warn { color: var(--warn); border-color: #ecd9b5; }
.btn.danger { color: var(--danger); border-color: #efc4be; }
.btn.big { padding: 0.8em 1.4em; font-size: 1.05rem; min-height: 50px; }
.btn.small { padding: 0.35em 0.8em; min-height: 34px; font-size: 0.9rem; }
.btn.tiny { padding: 0.15em 0.55em; min-height: 26px; font-size: 0.78rem; margin-left: auto; }
.ghost-btn { background: transparent; }
.active-toggle { background: #fff4e8; border-color: var(--accent); color: var(--accent); }

/* ---------- 공통 박스 ---------- */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.badge {
  display: inline-block;
  font-size: 0.72rem;
  padding: 0.15em 0.6em;
  border-radius: 999px;
  background: #fff1e4;
  color: var(--accent);
  vertical-align: middle;
  font-weight: 700;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 0.3em;
  padding: 0.3em 0.75em;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.14);
  font-size: 0.9rem;
  white-space: nowrap;
}
.notice { padding: 0.6em 0.8em; border-radius: 10px; font-size: 0.92rem; }
.notice.error { background: #fdecea; color: var(--danger); }
.notice.warn { background: #fff7e6; color: var(--warn); text-align: center; }

.conn-banner {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--danger);
  color: #fff;
  text-align: center;
  padding: 0.55em 1em;
  font-weight: 600;
  font-size: 0.92rem;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  background: #1f2a2e;
  color: #fff;
  padding: 0.7em 1.2em;
  border-radius: 12px;
  z-index: 60;
  max-width: 90vw;
  box-shadow: var(--shadow);
}
.toast.error { background: var(--danger); }

.center-screen {
  min-height: 80vh;
  display: grid;
  place-items: center;
  padding: 20px;
}
.center-screen .card { max-width: 420px; width: 100%; text-align: center; }

/* ---------- 폼 ---------- */
.form { display: flex; flex-direction: column; gap: 12px; }
.form label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 0.92rem; }
input[type='text'], input[type='password'], input:not([type]), select {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0.7em 0.8em;
  font-size: 1rem;
  background: #fff;
  min-height: 46px;
}
input:focus, select:focus { outline: 2px solid #9cc5b8; border-color: var(--brand); }
.code-input { font-size: 1.4rem !important; letter-spacing: 0.25em; text-transform: uppercase; text-align: center; font-weight: 700; }
.check { flex-direction: row !important; align-items: center; gap: 8px !important; font-weight: 500 !important; }
.check input { width: 18px; height: 18px; }

.seg { display: flex; background: #f1ece2; border-radius: 10px; padding: 3px; gap: 3px; margin-bottom: 12px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 0.5em; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button.active { background: #fff; color: var(--ink); box-shadow: var(--shadow); }

/* ---------- 첫 화면 ---------- */
.home { max-width: 440px; margin: 0 auto; padding: 28px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
.home-hero { text-align: center; }
.home-hero h1 { font-size: 1.7rem; }
.home-hero p { color: var(--muted); }
.logo { display: flex; justify-content: center; gap: 4px; margin-bottom: 10px; }
.logo .stone-icon { width: 34px; height: 34px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tabs button { padding: 0.8em; border-radius: 12px; border: 1px solid var(--line); background: #fff; font-weight: 700; cursor: pointer; color: var(--muted); }
.tabs button.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.home-foot { text-align: center; }

/* ---------- 게임 화면 ---------- */
.page { max-width: 1240px; margin: 0 auto; padding: 0 12px 32px; }
.topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: var(--brand);
  color: #fff;
  padding: 10px 16px;
  border-radius: 0 0 var(--radius) var(--radius);
  margin: 0 -12px 12px;
}
.brand { font-weight: 800; font-size: 1.05rem; }
.topbar-info { display: flex; flex-wrap: wrap; gap: 6px; }
.code-chip b { letter-spacing: 0.12em; font-size: 1.05rem; }
.phase-playing { background: #3d8b6e; }
.phase-paused { background: #b7791f; }
.phase-ended { background: #7a3e3e; }

.share { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; justify-content: space-between; margin-bottom: 12px; }
.share-url { font-weight: 700; font-size: 1.05rem; word-break: break-all; color: var(--brand); }
.big-code { font-size: 2.2rem; font-weight: 800; letter-spacing: 0.2em; color: var(--ink); line-height: 1.1; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.board-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.side-col { display: flex; flex-direction: column; gap: 12px; }

.status-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 16px;
  border-radius: var(--radius);
  background: #fff;
  border: 1px solid var(--line);
  margin-bottom: 10px;
}
.page.teacher .status-banner { margin-bottom: 0; }
.status-banner > div:first-child { display: flex; flex-direction: column; }
.status-banner strong { font-size: 1.1rem; }
.status-banner span { color: var(--muted); font-size: 0.9rem; }
.tone-vote { background: #eef4ff; border-color: #c7d8fb; }
.tone-teacher { background: #f3f0ea; }
.tone-paused { background: #fff7e6; border-color: #f2dcae; }
.tone-end { background: #fdeeee; border-color: #f0c9c9; }

.countdown { min-width: 120px; text-align: right; }
.countdown-num { font-size: 2rem; font-weight: 800; color: var(--blue); line-height: 1; }
.countdown-num small { font-size: 0.9rem; margin-left: 2px; }
.countdown-num em { font-size: 0.8rem; font-style: normal; color: var(--warn); }
.countdown.urgent .countdown-num { color: var(--danger); }
.progress { height: 6px; border-radius: 99px; background: #dde6f8; margin-top: 6px; overflow: hidden; }
.progress-bar { height: 100%; background: var(--blue); transition: width 0.2s linear; }
.countdown.urgent .progress-bar { background: var(--danger); }
.vote-card .countdown { text-align: left; }

/* ---------- 오목판 ---------- */
.board-wrap { position: relative; width: 100%; max-width: min(100%, 78vh, 720px); margin: 0 auto; }
.board { width: 100%; height: auto; display: block; touch-action: manipulation; user-select: none; -webkit-tap-highlight-color: transparent; }
.board.is-pointer { cursor: pointer; }
.board-bg { fill: var(--wood); }
.grid-line line { stroke: var(--wood-line); stroke-width: 1.1; }
.star { fill: var(--wood-line); }
.coord text { font-size: 14px; fill: #5b4320; font-weight: 700; }
.stone-B { stroke: #000; stroke-width: 0.6; }
.stone-W { stroke: #9a9a9a; stroke-width: 0.8; }
.last-dot { fill: #e63946; }
.win-ring { fill: none; stroke: #f5c518; stroke-width: 4; }
.ghost { opacity: 0.35; }
.ghost.strong { opacity: 0.55; }
.ghost-B { fill: #111; }
.ghost-W { fill: #fff; stroke: #888; }
.my-ring { fill: none; stroke: var(--blue); stroke-width: 3.5; }
.select-ring { fill: none; stroke: var(--accent); stroke-width: 3.5; }
.candidate { fill: rgba(224, 122, 47, 0.12); stroke: var(--accent); stroke-width: 2.2; stroke-dasharray: 5 4; }
.mark rect { fill: var(--blue); opacity: 0.92; }
.mark text { fill: #fff; font-size: 13px; font-weight: 800; }
.mark-tie rect { fill: var(--accent); }
.hover-label {
  position: absolute;
  top: 6px;
  right: 8px;
  background: rgba(31, 42, 46, 0.85);
  color: #fff;
  border-radius: 8px;
  padding: 2px 8px;
  font-weight: 700;
  font-size: 0.85rem;
  pointer-events: none;
}

.my-vote, .confirm-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 14px;
  text-align: center;
}
.big-label { font-size: 1.35rem; color: var(--blue); }
.confirm-bar .big-label { color: var(--accent); }

.controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding-top: 4px; }

/* ---------- 측면 패널 ---------- */
.teams { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.vs { color: var(--muted); font-weight: 800; font-size: 0.8rem; }
.team-tag { display: inline-flex; align-items: center; gap: 6px; padding: 0.3em 0.7em; border-radius: 999px; background: #f4f0e8; font-weight: 700; font-size: 0.9rem; }
.stone-icon { display: inline-block; border-radius: 50%; flex: none; }
.stone-icon-B { background: radial-gradient(circle at 35% 35%, #666, #111); }
.stone-icon-W { background: radial-gradient(circle at 35% 35%, #fff, #d6d6d6); border: 1px solid #aaa; }

.row-btns { display: flex; gap: 8px; margin: 8px 0; }
.row-btns.wrap { flex-wrap: wrap; }
.row-btns .btn { flex: 1; }
.vote-count { font-size: 1.05rem; }
.vote-card { display: flex; flex-direction: column; gap: 6px; }

.tally { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 6px; }
.tally li { display: grid; grid-template-columns: 42px 1fr auto; gap: 8px; align-items: center; font-size: 0.92rem; }
.tally li.chosen .tally-label { color: var(--accent); }
.tally li.chosen .tally-bar span { background: var(--accent); }
.tally li.more { display: block; }
.tally-label { font-weight: 800; }
.tally-bar { height: 10px; background: #eef1f5; border-radius: 99px; overflow: hidden; }
.tally-bar span { display: block; height: 100%; background: var(--blue); border-radius: 99px; }
.tally-count { font-weight: 700; white-space: nowrap; }
.result-headline { font-weight: 800; font-size: 1.05rem; }

.students { list-style: none; padding: 0; margin: 0; max-height: 340px; overflow: auto; }
.students li { display: flex; align-items: center; gap: 8px; padding: 6px 2px; border-bottom: 1px solid #f1ece2; }
.students li.offline .nick { color: var(--muted); }
.nick { font-weight: 600; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dot.on { background: #2fa36b; }
.dot.off { background: #c8c8c8; }
.vote-mark { font-size: 0.75rem; padding: 0.1em 0.5em; border-radius: 99px; background: #f1f1f1; color: var(--muted); }
.vote-mark.yes { background: #e6f4ec; color: #237a4f; }

.moves { list-style: none; padding: 0; margin: 0; max-height: 320px; overflow: auto; }
.moves li { display: flex; align-items: center; gap: 8px; padding: 5px 2px; border-bottom: 1px solid #f1ece2; }
.move-n { width: 26px; text-align: right; color: var(--muted); font-size: 0.8rem; }

details.card summary { cursor: pointer; list-style: none; }
details.card summary h3 { display: inline; }
details.card summary::after { content: ' ▾'; color: var(--muted); }

/* ---------- 승리 화면 ---------- */
.overlay { position: fixed; inset: 0; background: rgba(20, 26, 28, 0.55); display: grid; place-items: center; z-index: 70; padding: 16px; }
.overlay-box { background: #fff; border-radius: 20px; padding: 32px 28px; text-align: center; max-width: 440px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.overlay-box h2 { font-size: 2.2rem; margin: 8px 0 0; }
.overlay-box.win-students h2 { color: var(--blue); }
.overlay-box.win-teacher h2 { color: var(--brand); }
.overlay-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }

/* ---------- 반응형 ---------- */
@media (max-width: 960px) {
  .layout { grid-template-columns: 1fr; }
  .board-wrap { max-width: min(100%, 640px); }
}
@media (max-width: 520px) {
  .page { padding: 0 6px 24px; }
  .topbar { margin: 0 -6px 8px; padding: 8px 10px; }
  .brand { font-size: 0.95rem; }
  .chip { font-size: 0.8rem; padding: 0.25em 0.6em; }
  .status-banner { padding: 10px 12px; }
  .status-banner strong { font-size: 1rem; }
  .countdown { min-width: 80px; }
  .countdown-num { font-size: 1.7rem; }
  .card { padding: 12px; }
  .big-code { font-size: 1.8rem; }
  .board-wrap { max-width: 100%; }
}

/* ---------- 단일 HTML 버전 추가 ---------- */
.gl { stroke: var(--wood-line); stroke-width: 1.1; }
text.coord { font-size: 14px; fill: #5b4320; font-weight: 700; }
.conn-banner.info { background: #2563eb; }
.notice.ok { background: #e6f4ec; color: #237a4f; }
.resume { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px dashed #c9bfae; border-radius: 12px; background: #fbfaf7; }
.resume > div { flex: 1; }
.share-main { min-width: 0; flex: 1; }
[hidden] { display: none !important; }
.status-banner .cd-num, .status-banner .cd-paused { font-size: inherit; color: inherit; }
.status-banner .cd-paused { font-size: 0.8rem; color: var(--warn); }

</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
// ===================================================================
// 1. 오목 규칙 + 게임방 상태 (서버판 server/game.js, room.js 를 그대로 이식)
//    이 코드는 "교사 브라우저" 안에서만 실행되며, 학생 기기는 결과만 받는다.
// ===================================================================
const SIZE = 15;
const CELLS = SIZE * SIZE;
const COLS = 'ABCDEFGHIJKLMNO';
const TEACHER = 'teacher';
const STUDENTS = 'students';
const CONFIG = {
  voteSecondsOptions: [10, 15, 20, 30, 60],
  defaultVoteSeconds: 20,
  maxVoteRemainingSec: 180,
  maxStudents: 100,
};

const cellLabel = (cell) => `${COLS[cell % SIZE]}${Math.floor(cell / SIZE) + 1}`;
const isValidCell = (cell) => Number.isInteger(cell) && cell >= 0 && cell < CELLS;

function findWinLine(board, cell) {
  const color = board[cell];
  if (!color) return null;
  const r0 = Math.floor(cell / SIZE);
  const c0 = cell % SIZE;
  for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
    const line = [cell];
    for (const sign of [1, -1]) {
      let r = r0 + dr * sign;
      let c = c0 + dc * sign;
      while (r >= 0 && r < SIZE && c >= 0 && c < SIZE && board[r * SIZE + c] === color) {
        line.push(r * SIZE + c);
        r += dr * sign;
        c += dc * sign;
      }
    }
    if (line.length >= 5) return line.sort((a, b) => a - b);
  }
  return null;
}

class GameError extends Error {}
const fail = (msg) => {
  throw new GameError(msg);
};

class Room {
  constructor({ code, onAsyncUpdate = () => {}, now = Date.now }) {
    this.code = code;
    this.onAsyncUpdate = onAsyncUpdate;
    this.now = now;
    this.createdAt = now();
    this.participants = new Map(); // id -> { id, token, nickname, sockets:Set, joinedAt, lastSeen }
    this.tokenIndex = new Map();
    this.bannedTokens = new Set();
    this.participantSeq = 0;
    this.voteSeq = 0;
    this.settings = { voteSeconds: CONFIG.defaultVoteSeconds, firstTeam: TEACHER, autoStartVote: true };
    this.gameNo = 0;
    this.timer = null;
    this.resetGame();
  }

  // ---------- 참가자
  addParticipant(token, nickname) {
    if (this.participants.size >= CONFIG.maxStudents) fail('방 인원이 가득 찼습니다.');
    const lower = nickname.toLowerCase();
    for (const p of this.participants.values()) {
      if (p.nickname.toLowerCase() === lower) fail('이미 사용 중인 닉네임입니다. 다른 닉네임을 입력해 주세요.');
    }
    const id = `p${++this.participantSeq}`;
    const p = { id, token, nickname, sockets: new Set(), joinedAt: this.now(), lastSeen: this.now() };
    this.participants.set(id, p);
    this.tokenIndex.set(token, id);
    return p;
  }
  findParticipantByToken(token) {
    const id = this.tokenIndex.get(token);
    return id ? this.participants.get(id) : null;
  }
  removeParticipant(id, { ban = false } = {}) {
    const p = this.participants.get(id);
    if (!p) return null;
    this.participants.delete(id);
    this.tokenIndex.delete(p.token);
    if (ban) this.bannedTokens.add(p.token);
    if (this.vote) this.vote.ballots.delete(id);
    return p;
  }
  onlineStudentCount() {
    let n = 0;
    for (const p of this.participants.values()) if (p.sockets.size > 0) n++;
    return n;
  }

  // ---------- 게임 흐름
  resetGame() {
    this.clearTimer();
    this.gameNo += 1;
    this.phase = 'lobby';
    this.board = new Array(CELLS).fill(null);
    this.turn = null;
    this.teamColor = { [TEACHER]: 'B', [STUDENTS]: 'W' };
    this.moves = [];
    this.lastMove = null;
    this.result = null;
    this.vote = null;
    this.lastVoteResult = null;
  }
  start() {
    if (this.phase !== 'lobby') fail('대기 상태에서만 게임을 시작할 수 있습니다. 먼저 초기화해 주세요.');
    const first = this.settings.firstTeam;
    const second = first === TEACHER ? STUDENTS : TEACHER;
    this.teamColor = { [first]: 'B', [second]: 'W' };
    this.turn = first;
    this.phase = 'playing';
    this.maybeAutoVote();
  }
  pause() {
    if (this.phase !== 'playing') fail('진행 중인 게임만 일시정지할 수 있습니다.');
    this.phase = 'paused';
    if (this.vote?.status === 'open') {
      this.vote.remainingMs = Math.max(0, this.vote.endsAt - this.now());
      this.clearTimer();
    }
  }
  resume() {
    if (this.phase !== 'paused') fail('일시정지 상태가 아닙니다.');
    this.phase = 'playing';
    if (this.vote?.status === 'open') {
      this.vote.endsAt = this.now() + Math.max(1000, this.vote.remainingMs);
      this.vote.remainingMs = null;
      this.armTimer();
    }
  }
  endGame() {
    if (this.phase !== 'playing' && this.phase !== 'paused') fail('진행 중인 게임이 없습니다.');
    this.clearTimer();
    this.vote = null;
    this.phase = 'ended';
    this.result = { winner: null, reason: 'stopped', line: null };
  }
  setSettings(patch = {}) {
    const next = { ...this.settings };
    if (patch.voteSeconds !== undefined) {
      if (!CONFIG.voteSecondsOptions.includes(patch.voteSeconds)) fail('투표 시간은 10, 15, 20, 30, 60초 중에서 선택해 주세요.');
      next.voteSeconds = patch.voteSeconds;
    }
    if (patch.firstTeam !== undefined) {
      if (![TEACHER, STUDENTS].includes(patch.firstTeam)) fail('잘못된 선공 팀입니다.');
      if (this.phase !== 'lobby') fail('선공 팀은 게임 시작 전에만 바꿀 수 있습니다.');
      next.firstTeam = patch.firstTeam;
    }
    if (patch.autoStartVote !== undefined) next.autoStartVote = !!patch.autoStartVote;
    this.settings = next;
  }
  requirePlaying() {
    if (this.phase === 'paused') fail('게임이 일시정지 중입니다.');
    if (this.phase !== 'playing') fail('게임이 진행 중이 아닙니다.');
  }
  requireEmpty(cell) {
    if (!isValidCell(cell)) fail('잘못된 좌표입니다.');
    if (this.board[cell] !== null) fail('이미 돌이 놓인 자리입니다.');
  }
  teacherPlace(cell) {
    this.requirePlaying();
    if (this.turn !== TEACHER) fail('지금은 교사 팀 차례가 아닙니다.');
    this.requireEmpty(cell);
    this.placeStone(TEACHER, cell, { by: 'teacher' });
  }
  placeForStudents(cell) {
    this.requirePlaying();
    if (this.turn !== STUDENTS) fail('지금은 학생 팀 차례가 아닙니다.');
    this.requireEmpty(cell);
    this.placeStone(STUDENTS, cell, { by: 'teacher-direct' });
  }
  placeStone(team, cell, meta) {
    this.clearTimer();
    const color = this.teamColor[team];
    this.board[cell] = color;
    this.lastMove = cell;
    this.moves.push({ n: this.moves.length + 1, team, color, cell, label: cellLabel(cell), at: this.now(), ...meta });
    this.vote = null;
    const line = findWinLine(this.board, cell);
    if (line) {
      this.phase = 'ended';
      this.result = { winner: team, reason: 'five', line };
      return;
    }
    if (this.board.every((v) => v !== null)) {
      this.phase = 'ended';
      this.result = { winner: null, reason: 'draw', line: null };
      return;
    }
    this.turn = team === TEACHER ? STUDENTS : TEACHER;
    this.maybeAutoVote();
  }
  maybeAutoVote() {
    if (this.phase === 'playing' && this.turn === STUDENTS && this.settings.autoStartVote && !this.vote) this.openVote();
  }

  // ---------- 투표
  openVote({ candidates = null } = {}) {
    this.requirePlaying();
    if (this.turn !== STUDENTS) fail('학생 팀 차례에만 투표를 시작할 수 있습니다.');
    if (this.vote?.status === 'open') fail('이미 투표가 진행 중입니다.');
    const round = candidates && this.vote ? this.vote.round + 1 : 1;
    const durationMs = this.settings.voteSeconds * 1000;
    this.vote = {
      id: `v${this.gameNo}-${++this.voteSeq}`,
      round,
      status: 'open',
      candidates: candidates ? [...candidates] : null,
      ballots: new Map(),
      durationMs,
      endsAt: this.now() + durationMs,
      remainingMs: null,
      tieCells: null,
    };
    this.armTimer();
    return this.vote;
  }
  castVote(participantId, cell) {
    if (!this.participants.get(participantId)) fail('참가자 정보를 찾을 수 없습니다. 다시 입장해 주세요.');
    if (this.phase === 'paused') fail('게임이 일시정지 중입니다.');
    if (this.phase !== 'playing' || this.vote?.status !== 'open') fail('지금은 투표 시간이 아닙니다.');
    if (this.now() >= this.vote.endsAt) fail('투표 시간이 끝났습니다.');
    this.requireEmpty(cell);
    if (this.vote.candidates && !this.vote.candidates.includes(cell)) fail('재투표에서는 표시된 후보 좌표 중에서만 고를 수 있습니다.');
    this.vote.ballots.set(participantId, cell);
    return { voteId: this.vote.id, cell };
  }
  cancelBallot(participantId) {
    if (this.phase !== 'playing' || this.vote?.status !== 'open') fail('지금은 투표 시간이 아닙니다.');
    this.vote.ballots.delete(participantId);
    return { voteId: this.vote.id, cell: null };
  }
  tally() {
    if (!this.vote) return [];
    const counts = new Map();
    for (const [pid, cell] of this.vote.ballots) {
      if (!this.participants.has(pid)) continue;
      counts.set(cell, (counts.get(cell) || 0) + 1);
    }
    return [...counts.entries()]
      .map(([cell, count]) => ({ cell, label: cellLabel(cell), count }))
      .sort((a, b) => b.count - a.count || a.cell - b.cell);
  }
  extendVote(seconds = 10) {
    if (this.vote?.status !== 'open') fail('진행 중인 투표가 없습니다.');
    const cap = CONFIG.maxVoteRemainingSec * 1000;
    if (this.phase === 'paused') {
      this.vote.remainingMs = Math.min(cap, this.vote.remainingMs + seconds * 1000);
    } else {
      const remaining = Math.max(0, this.vote.endsAt - this.now());
      this.vote.endsAt = this.now() + Math.min(cap, remaining + seconds * 1000);
      this.armTimer();
    }
  }
  /** 같은 투표 id 로 여러 번 호출되어도 정확히 한 번만 확정 */
  closeVote(voteId) {
    const vote = this.vote;
    if (!vote || vote.id !== voteId || vote.status !== 'open') return false;
    if (this.phase !== 'playing' && this.phase !== 'paused') return false;
    this.clearTimer();
    const tally = this.tally();
    const totalVotes = tally.reduce((s, t) => s + t.count, 0);
    const result = {
      voteId: vote.id,
      round: vote.round,
      tally,
      totalVotes,
      eligible: Math.max(this.onlineStudentCount(), totalVotes),
      chosen: null,
      decidedBy: null,
      status: 'decided',
    };
    this.lastVoteResult = result;
    if (totalVotes === 0) {
      vote.status = 'noVotes';
      result.status = 'noVotes';
      return true;
    }
    const top = tally[0].count;
    const tied = tally.filter((t) => t.count === top).map((t) => t.cell);
    if (tied.length > 1) {
      vote.status = 'tie';
      vote.tieCells = tied;
      result.status = 'tie';
      return true;
    }
    result.chosen = tied[0];
    result.decidedBy = 'vote';
    this.placeStone(STUDENTS, tied[0], { by: 'vote', votes: top, totalVotes });
    return true;
  }
  resolveTie(cell) {
    this.requirePlaying();
    if (this.vote?.status !== 'tie') fail('동점 결정 대기 상태가 아닙니다.');
    if (!this.vote.tieCells.includes(cell)) fail('동점 후보 좌표 중에서 선택해 주세요.');
    this.requireEmpty(cell);
    const res = this.lastVoteResult;
    const votes = res?.tally.find((t) => t.cell === cell)?.count ?? 0;
    if (res) Object.assign(res, { chosen: cell, decidedBy: 'teacher-tie', status: 'decided' });
    this.placeStone(STUDENTS, cell, { by: 'teacher-tie', votes, totalVotes: res?.totalVotes ?? 0 });
  }
  runoff() {
    this.requirePlaying();
    if (this.vote?.status !== 'tie') fail('동점 상황에서만 추가 투표를 할 수 있습니다.');
    const candidates = this.vote.tieCells;
    this.vote.status = 'closed';
    this.openVote({ candidates });
  }
  revote() {
    this.requirePlaying();
    if (this.vote && this.vote.status === 'open') fail('이미 투표가 진행 중입니다.');
    this.vote = null;
    this.openVote();
  }

  // ---------- 타이머 (탭이 백그라운드여도 checkDeadline 이 보완)
  armTimer() {
    this.clearTimer();
    const vote = this.vote;
    if (!vote || vote.status !== 'open') return;
    this.timer = setTimeout(() => {
      this.timer = null;
      if (this.closeVote(vote.id)) this.onAsyncUpdate(this);
    }, Math.max(0, vote.endsAt - this.now()));
  }
  clearTimer() {
    if (this.timer) clearTimeout(this.timer);
    this.timer = null;
  }
  checkDeadline() {
    const v = this.vote;
    if (v?.status === 'open' && this.phase === 'playing' && this.now() >= v.endsAt) {
      if (this.closeVote(v.id)) this.onAsyncUpdate(this);
    }
  }

  // ---------- 보기용 상태
  voteView({ host }) {
    const v = this.vote;
    if (!v) return null;
    const remainingMs = v.status !== 'open' ? 0 : this.phase === 'paused' ? v.remainingMs : Math.max(0, v.endsAt - this.now());
    const view = {
      id: v.id,
      round: v.round,
      status: v.status,
      candidates: v.candidates,
      tieCells: v.tieCells,
      durationMs: v.durationMs,
      remainingMs,
      votedCount: [...v.ballots.keys()].filter((id) => this.participants.has(id)).length,
    };
    if (host && v.status === 'open') view.liveTally = this.tally(); // 득표 현황은 교사에게만
    return view;
  }
  publicState() {
    return {
      role: 'student',
      code: this.code,
      gameNo: this.gameNo,
      phase: this.phase,
      turn: this.turn,
      teamColor: this.teamColor,
      board: this.board,
      lastMove: this.lastMove,
      moves: this.moves,
      result: this.result,
      settings: { voteSeconds: this.settings.voteSeconds, firstTeam: this.settings.firstTeam },
      students: { online: this.onlineStudentCount(), total: this.participants.size },
      vote: this.voteView({ host: false }),
      lastVoteResult: this.lastVoteResult,
    };
  }
  hostState() {
    const ballots = this.vote?.status === 'open' ? this.vote.ballots : null;
    return {
      ...this.publicState(),
      role: 'host',
      settings: { ...this.settings },
      vote: this.voteView({ host: true }),
      participants: [...this.participants.values()].map((p) => ({
        id: p.id,
        nickname: p.nickname,
        online: p.sockets.size > 0,
        connections: p.sockets.size,
        voted: ballots ? ballots.has(p.id) : false,
      })),
    };
  }

  // ---------- 교사 브라우저 새로고침 대비 저장/복구
  serialize() {
    const v = this.vote;
    return {
      code: this.code,
      createdAt: this.createdAt,
      savedAt: this.now(),
      participantSeq: this.participantSeq,
      voteSeq: this.voteSeq,
      settings: this.settings,
      gameNo: this.gameNo,
      phase: this.phase,
      board: this.board,
      turn: this.turn,
      teamColor: this.teamColor,
      moves: this.moves,
      lastMove: this.lastMove,
      result: this.result,
      lastVoteResult: this.lastVoteResult,
      bannedTokens: [...this.bannedTokens],
      participants: [...this.participants.values()].map(({ id, token, nickname, joinedAt }) => ({ id, token, nickname, joinedAt })),
      vote: v
        ? {
            ...v,
            ballots: [...v.ballots.entries()],
            remainingMs: v.status === 'open' ? (this.phase === 'paused' ? v.remainingMs : Math.max(0, v.endsAt - this.now())) : null,
          }
        : null,
    };
  }
  static restore(data, opts) {
    const room = new Room({ code: data.code, ...opts });
    Object.assign(room, {
      createdAt: data.createdAt,
      participantSeq: data.participantSeq,
      voteSeq: data.voteSeq,
      settings: data.settings,
      gameNo: data.gameNo,
      phase: data.phase,
      board: data.board,
      turn: data.turn,
      teamColor: data.teamColor,
      moves: data.moves,
      lastMove: data.lastMove,
      result: data.result,
      lastVoteResult: data.lastVoteResult,
      bannedTokens: new Set(data.bannedTokens),
    });
    for (const p of data.participants) {
      room.participants.set(p.id, { ...p, sockets: new Set(), lastSeen: 0 });
      room.tokenIndex.set(p.token, p.id);
    }
    if (data.vote) {
      room.vote = { ...data.vote, ballots: new Map(data.vote.ballots) };
      // 새로고침 사이에 시간이 흐르지 않도록, 진행 중이던 투표는 일시정지 상태로 복구
      if (room.vote.status === 'open') {
        if (room.phase === 'playing') room.phase = 'paused';
        room.vote.remainingMs = Math.max(3000, data.vote.remainingMs ?? 3000);
      }
    }
    return room;
  }
}

const PEER_PREFIX = 'kr-classroom-omok-v1-'; // 공용 PeerJS 서버에서 다른 앱과 겹치지 않도록
const CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const TEAM_NAME = { teacher: '선생님 팀', students: '학생 팀' };
const STORE_HOST = 'omok1.hostRoom';
const storeStudentKey = (code) => `omok1.student.${code}`;

const $ = (sel) => document.querySelector(sel);
const esc = (v) =>
  String(v ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);

function randomHex(bytes) {
  const a = new Uint8Array(bytes);
  crypto.getRandomValues(a);
  return [...a].map((b) => b.toString(16).padStart(2, '0')).join('');
}
function genCode(len = 5) {
  const a = new Uint32Array(len);
  crypto.getRandomValues(a);
  return [...a].map((n) => CODE_ALPHABET[n % CODE_ALPHABET.length]).join('');
}
const cleanCode = (v) => String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
function normalizeNickname(input) {
  if (typeof input !== 'string') return null;
  const name = input.replace(/[\u0000-\u001f\u007f<>]/g, '').replace(/\s+/g, ' ').trim();
  const n = Array.from(name).length;
  return n >= 1 && n <= 12 ? name : null;
}
const store = {
  get(key) {
    try {
      return JSON.parse(localStorage.getItem(key));
    } catch {
      return null;
    }
  },
  set(key, value) {
    try {
      if (value === null) localStorage.removeItem(key);
      else localStorage.setItem(key, JSON.stringify(value));
    } catch {
      /* 저장소 사용 불가 */
    }
  },
};

class TokenBucket {
  constructor(capacity, perSec) {
    this.capacity = capacity;
    this.perMs = perSec / 1000;
    this.tokens = capacity;
    this.last = Date.now();
  }
  take() {
    const t = Date.now();
    this.tokens = Math.min(this.capacity, this.tokens + (t - this.last) * this.perMs);
    this.last = t;
    if (this.tokens < 1) return false;
    this.tokens -= 1;
    return true;
  }
}

/** PeerJS 라이브러리(CDN) 로딩 대기 */
function getPeerClass(timeoutMs = 10000) {
  return new Promise((resolve) => {
    const started = Date.now();
    (function check() {
      const P = window.Peer || window.peerjs?.Peer;
      if (P) return resolve(P);
      if (Date.now() - started > timeoutMs) return resolve(null);
      setTimeout(check, 100);
    })();
  });
}

const GAP = 40;
const PAD = 46;
const VIEW = PAD * 2 + GAP * (SIZE - 1);
const xy = (cell) => [PAD + (cell % SIZE) * GAP, PAD + Math.floor(cell / SIZE) * GAP];
const STATIC_BOARD = (() => {
  let s = `<rect x="0" y="0" width="${VIEW}" height="${VIEW}" rx="14" class="board-bg"/>`;
  for (let i = 0; i < SIZE; i++) {
    const p = PAD + i * GAP;
    const end = PAD + (SIZE - 1) * GAP;
    s += `<line class="gl" x1="${PAD}" y1="${p}" x2="${end}" y2="${p}"/><line class="gl" x1="${p}" y1="${PAD}" x2="${p}" y2="${end}"/>`;
    s += `<text class="coord" x="${p}" y="${PAD - 26}" text-anchor="middle">${COLS[i]}</text>`;
    s += `<text class="coord" x="${PAD - 28}" y="${p + 5}" text-anchor="middle">${i + 1}</text>`;
  }
  for (const c of [48, 56, 112, 168, 176]) {
    const [x, y] = xy(c);
    s += `<circle cx="${x}" cy="${y}" r="4" class="star"/>`;
  }
  return s;
})();

function boardSVG({ role, board, lastMove, winLine, marks = {}, highlight = null, myCell = null, selectedCell = null, ghostColor = null, clickable = false }) {
  const win = new Set(winLine || []);
  let s = `<svg class="board ${clickable ? 'is-pointer' : ''}" data-role="${role}" viewBox="0 0 ${VIEW} ${VIEW}" role="img" aria-label="15×15 오목판">`;
  s += `<defs><radialGradient id="gB" cx="35%" cy="35%" r="65%"><stop offset="0%" stop-color="#666"/><stop offset="100%" stop-color="#111"/></radialGradient>`;
  s += `<radialGradient id="gW" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#d9d9d9"/></radialGradient></defs>`;
  s += STATIC_BOARD;
  for (const c of highlight || []) {
    const [x, y] = xy(c);
    s += `<circle cx="${x}" cy="${y}" r="17" class="candidate"/>`;
  }
  board.forEach((v, c) => {
    if (!v) return;
    const [x, y] = xy(c);
    s += `<circle cx="${x}" cy="${y}" r="17.5" fill="url(#g${v})" class="stone-${v}"/>`;
    if (win.has(c)) s += `<circle cx="${x}" cy="${y}" r="19" class="win-ring"/>`;
    if (c === lastMove) s += `<circle cx="${x}" cy="${y}" r="5" class="last-dot"/>`;
  });
  for (const [cell, ring] of [[myCell, 'my-ring'], [selectedCell, 'select-ring']]) {
    if (cell === null || cell === undefined || board[cell]) continue;
    const [x, y] = xy(cell);
    if (ghostColor) s += `<circle cx="${x}" cy="${y}" r="17" class="ghost ghost-${ghostColor}"/>`;
    s += `<circle cx="${x}" cy="${y}" r="19" class="${ring}"/>`;
  }
  for (const [c, m] of Object.entries(marks)) {
    const cell = Number(c);
    if (board[cell]) continue;
    const [x, y] = xy(cell);
    const w = Math.max(22, 10 + String(m.text).length * 9);
    s += `<g class="mark ${m.tone === 'tie' ? 'mark-tie' : ''}"><rect x="${x - w / 2}" y="${y - 11}" width="${w}" height="22" rx="11"/><text x="${x}" y="${y + 5}" text-anchor="middle">${esc(m.text)}</text></g>`;
  }
  return `${s}</svg>`;
}

function cellFromClick(svg, e) {
  const rect = svg.getBoundingClientRect();
  const x = ((e.clientX - rect.left) * VIEW) / rect.width;
  const y = ((e.clientY - rect.top) * VIEW) / rect.height;
  const col = Math.round((x - PAD) / GAP);
  const row = Math.round((y - PAD) / GAP);
  if (col < 0 || col >= SIZE || row < 0 || row >= SIZE) return null;
  return row * SIZE + col;
}

// ---------- 공통 조각
const stoneIcon = (color, size = 16) => `<span class="stone-icon stone-icon-${color}" style="width:${size}px;height:${size}px"></span>`;

function tallyHTML(tally, total, chosen = null, limit = 8) {
  if (!tally?.length) return '<p class="muted">아직 투표가 없습니다.</p>';
  const max = tally[0].count || 1;
  let s = '<ol class="tally">';
  for (const t of tally.slice(0, limit)) {
    const pct = total ? ` <small>(${Math.round((t.count / total) * 100)}%)</small>` : '';
    s += `<li class="${t.cell === chosen ? 'chosen' : ''}"><span class="tally-label">${t.label}</span><span class="tally-bar"><span style="width:${(t.count / max) * 100}%"></span></span><span class="tally-count">${t.count}표${pct}</span></li>`;
  }
  if (tally.length > limit) s += `<li class="muted more">외 ${tally.length - limit}개 좌표</li>`;
  return `${s}</ol>`;
}

function voteResultHTML(r) {
  if (!r) return '';
  let headline = '';
  if (r.status === 'noVotes') headline = '아무도 투표하지 않았습니다.';
  else if (r.status === 'tie') headline = '동점입니다! 선생님이 결정합니다.';
  else if (r.chosen !== null) {
    const label = cellLabel(r.chosen);
    headline = r.decidedBy === 'teacher-tie' ? `동점 중 선생님이 ${label}을(를) 선택했습니다.` : `최종 결정: ${label}`;
  }
  const invalid = Math.max(0, r.eligible - r.totalVotes);
  return `<section class="card"><h3>투표 결과 ${r.round > 1 ? '<span class="badge">재투표</span>' : ''}</h3><p class="result-headline">${headline}</p><p class="muted small">투표 ${r.totalVotes}명 · 무효(미투표) ${invalid}명</p>${tallyHTML(r.tally, r.totalVotes, r.chosen, 6)}</section>`;
}

function movesHTML(moves) {
  if (!moves.length) return '<p class="muted">아직 둔 수가 없습니다.</p>';
  return `<ol class="moves">${[...moves]
    .reverse()
    .map((m) => `<li><span class="move-n">${m.n}</span>${stoneIcon(m.color, 13)}<b>${m.label}</b><span class="muted small">${moveByText(m)}</span></li>`)
    .join('')}</ol>`;
}

function overlayHTML(state, extraButtons = '') {
  if (state.phase !== 'ended' || !state.result) return '';
  const r = state.result;
  return `<div class="overlay" role="dialog" aria-modal="true"><div class="overlay-box ${r.winner ? `win-${r.winner}` : ''}">${r.winner ? stoneIcon(state.teamColor[r.winner], 56) : ''}<h2>${resultText(r)}</h2><p class="muted">총 ${state.moves.length}수 진행</p><div class="overlay-actions">${extraButtons}<button class="btn" data-act="closeOverlay">오목판 보기</button></div></div></div>`;
}

function countdownOf(state) {
  const v = state?.vote;
  if (!v || v.status !== 'open') return null;
  const paused = state.phase === 'paused';
  const ms = paused ? v.remainingMs : Math.max(0, v.remainingMs - (performance.now() - state.receivedAt));
  return { seconds: Math.ceil(ms / 1000), ratio: v.durationMs ? Math.min(1, ms / v.durationMs) : 0, paused };
}

// ===================================================================
// 4. 교사(방장) — 이 브라우저가 게임 서버 역할
// ===================================================================
const Host = {
  room: null,
  peer: null,
  conns: new Set(),
  status: 'starting', // starting | online | reconnecting | failed
  statusMsg: '',
  isNewRoom: true,
  openAttempts: 0,
  saveTimer: null,
  ui: { selected: null, directMode: false, hideTally: false, tab: 'students', overlayHiddenFor: null, error: '', turnKey: '' },

  async start(snapshot) {
    const Peer = await getPeerClass();
    if (!Peer) return showHome(LIB_ERROR);
    this.isNewRoom = !snapshot;
    const onAsyncUpdate = () => this.sync();
    this.room = snapshot ? Room.restore(snapshot, { onAsyncUpdate }) : new Room({ code: genCode(), onAsyncUpdate });
    this.openAttempts = 0;
    go('#host', { replace: true });
    this.openPeer(Peer);
    clearInterval(this.ticker);
    this.ticker = setInterval(() => this.tick(), 500);
  },

  openPeer(Peer) {
    this.status = this.openAttempts ? 'reconnecting' : 'starting';
    renderTeacher();
    const peer = new Peer(PEER_PREFIX + this.room.code, { debug: 0 });
    this.peer = peer;
    peer.on('open', () => {
      this.status = 'online';
      this.statusMsg = '';
      this.save();
      renderTeacher();
    });
    peer.on('connection', (conn) => this.onConnection(conn));
    peer.on('disconnected', () => {
      if (peer.destroyed || this.peer !== peer) return;
      this.status = 'reconnecting';
      renderTeacher();
      setTimeout(() => !peer.destroyed && peer.reconnect(), 1500);
    });
    peer.on('error', (err) => {
      if (this.peer !== peer) return;
      if (err.type === 'unavailable-id') {
        peer.destroy();
        this.openAttempts += 1;
        if (this.isNewRoom && this.room.participants.size === 0 && this.room.moves.length === 0) {
          this.room.code = genCode(); // 코드가 겹치면 새 코드
          return this.openPeer(Peer);
        }
        // 새로고침 직후에는 이전 연결이 정리될 때까지 잠시 걸린다
        if (this.openAttempts > 12) {
          this.status = 'failed';
          this.statusMsg = '이 방이 다른 탭이나 기기에서 이미 열려 있습니다. 다른 창을 닫고 새로고침해 주세요.';
          return renderTeacher();
        }
        this.statusMsg = '이전 연결을 정리하는 중입니다…';
        return setTimeout(() => this.openPeer(Peer), 2500);
      }
      if (err.type === 'browser-incompatible') {
        this.status = 'failed';
        this.statusMsg = '이 브라우저는 실시간 연결(WebRTC)을 지원하지 않습니다. 최신 Chrome, Edge, Safari를 사용해 주세요.';
        return renderTeacher();
      }
      if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) {
        this.status = 'reconnecting';
        this.statusMsg = '중계 서버와 연결이 불안정합니다. 다시 연결하는 중…';
        renderTeacher();
        setTimeout(() => {
          if (peer.destroyed) this.openPeer(Peer);
          else if (peer.disconnected) peer.reconnect();
        }, 3000);
      }
    });
  },

  tick() {
    if (!this.room) return;
    this.room.checkDeadline();
    const t = Date.now();
    for (const c of [...this.conns]) {
      if (t - c.lastSeen > 20000) {
        try {
          c.conn.close();
        } catch {}
        this.drop(c);
      }
    }
  },

  // ---------- 학생 연결
  onConnection(conn) {
    const c = { conn, pid: null, bucket: new TokenBucket(20, 8), lastSeen: Date.now() };
    this.conns.add(c);
    conn.on('data', (d) => this.onData(c, d));
    conn.on('close', () => this.drop(c));
    conn.on('error', () => this.drop(c));
  },
  send(c, msg) {
    try {
      if (c.conn.open) c.conn.send(msg);
    } catch {}
  },
  drop(c) {
    if (!this.conns.delete(c)) return;
    const p = c.pid && this.room?.participants.get(c.pid);
    if (p) {
      p.sockets.delete(c);
      p.lastSeen = Date.now();
    }
    this.sync();
  },
  onData(c, data) {
    c.lastSeen = Date.now();
    this.room.checkDeadline();
    if (!data || typeof data !== 'object' || typeof data.t !== 'string') return;
    if (data.t === 'ping') return this.send(c, { t: 'pong' });
    let size = 0;
    try {
      size = JSON.stringify(data).length;
    } catch {
      return;
    }
    if (size > 2000) return; // 비정상적으로 큰 메시지 무시
    const reply = (res) => data.id !== undefined && this.send(c, { re: data.id, ...res });
    if (!c.bucket.take()) return reply({ ok: false, error: '요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.' });
    try {
      reply({ ok: true, ...(this.handleStudent(c, data) || {}) });
    } catch (err) {
      if (!(err instanceof GameError)) console.error(err);
      reply({ ok: false, error: err instanceof GameError ? err.message : '처리 중 오류가 발생했습니다.' });
    }
  },
  handleStudent(c, data) {
    const room = this.room;
    // 학생 연결로는 아래 네 가지 요청만 받는다. 방장 동작은 이 화면(교사 기기)에서만 실행된다.
    switch (data.t) {
      case 'join': {
        if (cleanCode(data.code) !== room.code) fail('방 코드가 올바르지 않습니다.');
        if (typeof data.token === 'string' && /^[0-9a-f]{32}$/.test(data.token)) {
          if (room.bannedTokens.has(data.token)) fail('선생님이 이 방에서 내보낸 참가자입니다.');
          const ex = room.findParticipantByToken(data.token);
          if (ex) {
            this.attach(c, ex);
            return { participantId: ex.id, nickname: ex.nickname, restored: true };
          }
        }
        const name = normalizeNickname(data.nickname);
        if (!name) fail('닉네임은 1~12자로 입력해 주세요.');
        const token = randomHex(16);
        const p = room.addParticipant(token, name);
        this.attach(c, p);
        return { participantId: p.id, nickname: p.nickname, token, restored: false };
      }
      case 'vote': {
        const p = this.requireStudent(c);
        const res = room.castVote(p.id, data.cell);
        this.sendMe(p);
        this.sync();
        return res;
      }
      case 'unvote': {
        const p = this.requireStudent(c);
        const res = room.cancelBallot(p.id);
        this.sendMe(p);
        this.sync();
        return res;
      }
      case 'leave': {
        const p = this.requireStudent(c);
        for (const other of p.sockets) {
          if (other !== c) this.send(other, { t: 'kicked', reason: 'left' });
          other.pid = null;
        }
        room.removeParticipant(p.id);
        this.sync();
        return {};
      }
      default:
        fail('알 수 없는 요청입니다.');
    }
  },
  requireStudent(c) {
    const p = c.pid && this.room.participants.get(c.pid);
    if (!p || !p.sockets.has(c)) fail('참가자 정보가 없습니다. 다시 입장해 주세요.');
    return p;
  },
  attach(c, p) {
    if (c.pid && c.pid !== p.id) this.room.participants.get(c.pid)?.sockets.delete(c);
    c.pid = p.id;
    p.sockets.add(c);
    p.lastSeen = Date.now();
    this.send(c, { t: 'state', s: this.room.publicState() });
    this.send(c, { t: 'me', m: this.meView(p) });
    this.sync();
  },
  meView(p) {
    const v = this.room.vote;
    return { participantId: p.id, nickname: p.nickname, voteId: v?.id ?? null, cell: v?.status === 'open' ? v.ballots.get(p.id) ?? null : null };
  },
  sendMe(p) {
    const m = this.meView(p);
    for (const c of p.sockets) this.send(c, { t: 'me', m });
  },

  /** 모든 학생에게 상태 전송 + 교사 화면 갱신 + 저장 */
  sync() {
    if (!this.room) return;
    const s = this.room.publicState();
    for (const c of this.conns) if (c.pid) this.send(c, { t: 'state', s });
    renderTeacher();
    if (!this.saveTimer) {
      this.saveTimer = setTimeout(() => {
        this.saveTimer = null;
        this.save();
      }, 300);
    }
  },
  save() {
    if (this.room) store.set(STORE_HOST, this.room.serialize());
  },

  // ---------- 교사 동작
  act(type, extra = {}) {
    const room = this.room;
    try {
      switch (type) {
        case 'start': room.start(); break;
        case 'pause': room.pause(); break;
        case 'resume': room.resume(); break;
        case 'end': room.endGame(); break;
        case 'reset': room.resetGame(); break;
        case 'rematch': room.resetGame(); room.start(); break;
        case 'settings': room.setSettings(extra); break;
        case 'place': room.teacherPlace(extra.cell); break;
        case 'placeForStudents': room.placeForStudents(extra.cell); break;
        case 'resolveTie': room.resolveTie(extra.cell); break;
        case 'startVote': room.revote(); break;
        case 'runoff': room.runoff(); break;
        case 'extendVote': room.extendVote(10); break;
        case 'closeVote':
          if (room.phase === 'paused') fail('일시정지를 먼저 해제해 주세요.');
          if (room.vote?.status !== 'open') fail('진행 중인 투표가 없습니다.');
          room.closeVote(room.vote.id);
          break;
        case 'kick': {
          const p = room.removeParticipant(extra.id, { ban: true });
          if (!p) fail('해당 학생을 찾을 수 없습니다.');
          for (const c of p.sockets) {
            this.send(c, { t: 'kicked', reason: 'kicked' });
            c.pid = null;
          }
          break;
        }
        default:
          fail('알 수 없는 동작입니다.');
      }
      this.sync();
      return true;
    } catch (err) {
      this.showError(err instanceof GameError ? err.message : '오류가 발생했습니다.');
      if (!(err instanceof GameError)) console.error(err);
      return false;
    }
  },
  showError(msg) {
    this.ui.error = msg;
    renderTeacher();
    clearTimeout(this.errTimer);
    this.errTimer = setTimeout(() => {
      this.ui.error = '';
      renderTeacher();
    }, 3500);
  },
  /** 방 삭제: 학생 화면 종료 + 이 기기에 저장된 방 데이터 삭제 */
  destroyRoom() {
    for (const c of this.conns) this.send(c, { t: 'closed', reason: 'deleted' });
    const conns = [...this.conns];
    const peer = this.peer;
    setTimeout(() => {
      conns.forEach((c) => {
        try {
          c.conn.close();
        } catch {}
      });
      peer?.destroy();
    }, 500);
    this.room?.clearTimer();
    clearInterval(this.ticker);
    this.room = null;
    this.peer = null;
    this.conns = new Set();
    store.set(STORE_HOST, null);
    showHome('게임방을 삭제했습니다. 학생 닉네임, 투표, 기록이 모두 지워졌습니다.');
  },
};

// ===================================================================
// 5. 학생 — 교사 브라우저에 P2P 로 접속
// ===================================================================
const Student = {
  code: null,
  peer: null,
  conn: null,
  connected: false,
  everJoined: false,
  state: null,
  me: null,
  closed: null,
  fatal: '',
  seq: 0,
  pending: new Map(),
  firstJoin: null,
  lastRecv: 0,
  ui: { pendingCell: null, toast: '', overlayHiddenFor: null },

  /** @returns {Promise<{ok:boolean,error?:string}>} 첫 입장 결과 */
  async start(code, { initial }) {
    const Peer = await getPeerClass();
    if (!Peer) return { ok: false, error: LIB_ERROR };
    this.teardown();
    Object.assign(this, { code, closed: null, fatal: '', state: null, me: null, everJoined: false, initial, Peer });
    const result = new Promise((resolve) => (this.firstJoin = resolve));
    this.ensurePeer();
    clearInterval(this.pingTimer);
    this.pingTimer = setInterval(() => this.heartbeat(), 5000);
    return result;
  },
  finishFirst(res) {
    if (this.firstJoin) {
      this.firstJoin(res);
      this.firstJoin = null;
    }
  },
  ensurePeer() {
    if (this.peer && !this.peer.destroyed) {
      if (this.peer.disconnected) this.peer.reconnect();
      else if (this.peer.open) this.connectToHost();
      return;
    }
    const peer = new this.Peer({ debug: 0 });
    this.peer = peer;
    peer.on('open', () => this.connectToHost());
    peer.on('disconnected', () => setTimeout(() => !peer.destroyed && peer.reconnect(), 1500));
    peer.on('error', (err) => {
      if (this.peer !== peer) return;
      if (err.type === 'peer-unavailable') {
        if (this.initial && !this.everJoined) {
          this.finishFirst({ ok: false, error: '방을 찾을 수 없습니다. 방 코드를 확인하고, 선생님 화면이 열려 있는지 확인해 주세요.' });
          return this.teardown();
        }
        return this.lost(); // 선생님 화면이 새로고침 중일 수 있음 → 계속 재시도
      }
      if (err.type === 'browser-incompatible') {
        this.fatal = '이 브라우저는 실시간 연결(WebRTC)을 지원하지 않습니다. 최신 Chrome, Safari, 삼성 인터넷을 사용해 주세요.';
        this.finishFirst({ ok: false, error: this.fatal });
        return renderStudent();
      }
      this.lost();
    });
  },
  connectToHost() {
    if (this.closed || (this.conn && this.conn.open)) return;
    const conn = this.peer.connect(PEER_PREFIX + this.code, { reliable: true, serialization: 'json' });
    this.conn = conn;
    const timer = setTimeout(() => {
      if (conn.open || this.conn !== conn) return;
      try {
        conn.close();
      } catch {}
      if (this.initial && !this.everJoined) {
        this.finishFirst({ ok: false, error: '선생님 기기와 연결하지 못했습니다. 같은 인터넷에 연결되어 있는지 확인하고 다시 시도해 주세요. (학교망이 실시간 연결을 막는 경우도 있습니다)' });
        return this.teardown();
      }
      this.lost();
    }, 15000);
    conn.on('open', () => {
      clearTimeout(timer);
      this.connected = true;
      this.lastRecv = Date.now();
      this.join();
      renderStudent();
    });
    conn.on('data', (d) => this.onData(d));
    const onClose = () => {
      clearTimeout(timer);
      if (this.conn === conn) this.lost();
    };
    conn.on('close', onClose);
    conn.on('error', onClose);
  },
  lost() {
    this.connected = false;
    this.conn = null;
    for (const resolve of this.pending.values()) resolve({ ok: false, error: '연결이 끊어졌습니다.' });
    this.pending.clear();
    renderStudent();
    if (this.closed || this.fatal) return;
    clearTimeout(this.retryTimer);
    this.retryTimer = setTimeout(() => this.ensurePeer(), 2000);
  },
  heartbeat() {
    if (!this.conn?.open) return;
    if (Date.now() - this.lastRecv > 16000) {
      try {
        this.conn.close();
      } catch {}
      return this.lost();
    }
    try {
      this.conn.send({ t: 'ping' });
    } catch {}
  },
  async join() {
    const saved = store.get(storeStudentKey(this.code)) || {};
    const res = await this.request('join', { code: this.code, token: saved.token, nickname: saved.nickname });
    if (res.ok) {
      this.everJoined = true;
      store.set(storeStudentKey(this.code), { token: res.token || saved.token, nickname: res.nickname });
      store.set('omok1.lastNickname', res.nickname);
      this.finishFirst(res);
      renderStudent();
      return;
    }
    if (res.error === '연결이 끊어졌습니다.') return; // lost() 가 재시도
    if (this.initial && !this.everJoined) {
      this.finishFirst(res);
      return this.teardown();
    }
    if (/닉네임/.test(res.error)) {
      // 저장된 정보가 없어진 경우(예: 선생님이 방을 새로 만듦) → 다시 입장
      store.set(storeStudentKey(this.code), null);
      this.teardown();
      return showHome(res.error, { join: this.code });
    }
    this.fatal = res.error;
    this.teardown();
    renderStudent();
  },
  request(t, payload = {}, timeoutMs = 6000) {
    return new Promise((resolve) => {
      if (!this.conn?.open) return resolve({ ok: false, error: '연결이 끊어졌습니다.' });
      const id = ++this.seq;
      const timer = setTimeout(() => {
        if (this.pending.delete(id)) resolve({ ok: false, error: '응답이 없습니다. 잠시 후 다시 시도해 주세요.' });
      }, timeoutMs);
      this.pending.set(id, (res) => {
        clearTimeout(timer);
        resolve(res);
      });
      try {
        this.conn.send({ id, t, ...payload });
      } catch {
        this.pending.delete(id);
        resolve({ ok: false, error: '연결이 끊어졌습니다.' });
      }
    });
  },
  onData(msg) {
    this.lastRecv = Date.now();
    if (!msg || typeof msg !== 'object') return;
    if (msg.re !== undefined) {
      const resolve = this.pending.get(msg.re);
      this.pending.delete(msg.re);
      return resolve?.(msg);
    }
    if (msg.t === 'state' && msg.s?.code === this.code) {
      this.state = { ...msg.s, receivedAt: performance.now() };
      renderStudent();
    } else if (msg.t === 'me') {
      this.me = msg.m;
      renderStudent();
    } else if (msg.t === 'closed' || msg.t === 'kicked') {
      this.closed = msg.t === 'closed' ? msg.reason || 'deleted' : msg.reason === 'left' ? 'left' : 'kicked';
      if (this.closed !== 'deleted') store.set(storeStudentKey(this.code), null);
      this.teardown();
      renderStudent();
    }
  },
  teardown() {
    clearTimeout(this.retryTimer);
    clearInterval(this.pingTimer);
    const peer = this.peer;
    this.peer = null;
    this.conn = null;
    this.connected = false;
    try {
      peer?.destroy();
    } catch {}
  },
};

// ===================================================================
// 6. 화면
// ===================================================================
let currentView = null;

function go(hash, { replace = false } = {}) {
  if (replace) history.replaceState(null, '', hash || location.pathname + location.search);
  else history.pushState(null, '', hash || location.pathname + location.search);
}

function parseHash() {
  const h = location.hash;
  let m = h.match(/^#join=([A-Za-z0-9]{4,6})$/);
  if (m) return { page: 'home', join: m[1].toUpperCase() };
  m = h.match(/^#play=([A-Za-z0-9]{4,6})$/);
  if (m) return { page: 'play', code: m[1].toUpperCase() };
  if (h === '#host') return { page: 'host' };
  return { page: 'home' };
}

function route() {
  const r = parseHash();
  if (r.page === 'host') {
    if (Host.room) return renderTeacher(true);
    const snap = store.get(STORE_HOST);
    if (snap) return Host.start(snap);
    return showHome();
  }
  if (r.page === 'play') {
    if (Student.code === r.code && (Student.peer || Student.closed || Student.fatal)) return renderStudent(true);
    const saved = store.get(storeStudentKey(r.code));
    if (!saved?.token) return showHome('', { join: r.code });
    Student.start(r.code, { initial: false }).then(() => {});
    return renderStudent(true);
  }
  showHome('', { join: r.join });
}

// ---------- 첫 화면
function showHome(message = '', { join = '' } = {}) {
